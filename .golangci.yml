version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - govet
    - gosec
    - ineffassign
    - lll
    - misspell
    - nakedret
    - paralleltest
    - revive
    - unconvert
    - unused
  exclusions:
    paths:
      - vendor$
      - third_party$
      - testdata$
      - Godeps$
      - builtin$
formatters:
  enable:
    - gofmt
